    label: Üst başlık
    type: string
  - name: title
    label: Bölüm başlığı
    type: string
  - name: action_text
    label: Buton yazısı
    type: string
  - name: action_link
    label: Buton bağlantısı
    type: string
  - name: items
    label: Duyurular
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: date
      label: Tarih
      type: string
    - name: title
      label: Duyuru başlığı
      type: string
    - name: slug
      label: URL kısa adı
      type: string
    - name: text
      label: Kısa açıklama
      type: text
    - name: detail
      label: Detay
      type: rich-text
      options:
        format: markdown
    - name: cover
      label: Kapak görseli
      type: image
      options:
        media: images
    - name: url
      label: Sayfa yolu
      type: string
- name: magazine
  label: Dergi
  type: file
  path: content/magazine.json
  format: json
  operations:
    delete: false
    rename: false
  fields:
  - name: eyebrow
    label: Üst başlık
    type: string
  - name: title_line_1
    label: Başlık 1
    type: string
  - name: title_line_2
    label: Başlık 2
    type: string
  - name: description
    label: Açıklama
    type: text
  - name: cover_title
    label: Kapak başlığı
    type: string
  - name: cover_issue
    label: Kapak sayı bilgisi
    type: string
  - name: button_text
    label: Buton yazısı
    type: string
  - name: button_link
    label: Buton bağlantısı
    type: string
  - name: archive_eyebrow
    label: Arşiv üst başlığı
    type: string
  - name: archive_title
    label: Arşiv başlığı
    type: string
  - name: issues
    label: Dergi sayıları
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{number} · {title}'
    fields:
    - name: number
      label: Sayı
      type: string
    - name: title
      label: Başlık
      type: string
    - name: slug
      label: URL kısa adı
      type: string
    - name: text
      label: Kısa açıklama
      type: text
    - name: detail
      label: Detay
      type: rich-text
      options:
        format: markdown
    - name: cover
      label: Kapak görseli
      type: image
      options:
        media: images
    - name: pdf
      label: Dergi PDF
      type: file
      options:
        media: documents
        extensions:
        - pdf
    - name: link_text
      label: PDF buton yazısı
      type: string
    - name: url
      label: Sayfa yolu
      type: string
    - name: pages
      label: Sayfa görselleri
      type: image
      list: true
      options:
        media: images
