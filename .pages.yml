media:
- name: images
  label: Görseller
  input: media/uploads
  output: /media/uploads
  categories:
  - image
  extensions:
  - png
  - jpg
  - jpeg
  - webp
  - gif
  rename: safe
- name: documents
  label: Belgeler
  input: media/documents
  output: /media/documents
  categories:
  - document
  extensions:
  - pdf
  rename: safe
content:
- name: articles
  label: İçerikler
  type: collection
  path: content/articles
  format: yaml-frontmatter
  filename: '{fields.slug}.md'
  view:
    primary: title
    fields:
    - title
    - category
    - date
    - published
    sort:
    - date
    - title
    search:
    - title
    - category
    - summary
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Başlık
    type: string
    required: true
  - name: slug
    label: URL kısa adı
    type: string
    required: true
    pattern: ^[a-z0-9-]+$
  - name: category
    label: Kategori
    type: string
    required: true
  - name: summary
    label: Kısa açıklama
    type: text
  - name: date
    label: Yayın tarihi
    type: date
  - name: cover
    label: Kapak görseli
    type: image
    options:
      media: images
  - name: published
    label: Yayında
    type: boolean
    default: true
  - name: body
    label: İçerik
    type: rich-text
    options:
      media: images
      format: markdown
- name: events
  label: Etkinlikler
  type: file
  path: content/events.json
  format: json
  operations:
    delete: false
    rename: false
  fields:
  - name: eyebrow
    label: Üst başlık
    type: string
  - name: title
    label: Bölüm başlığı
    type: string
  - name: items
    label: Etkinlikler
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: number
      label: Sıra
      type: string
    - name: title
      label: Etkinlik adı
      type: string
    - name: slug
      label: URL kısa adı
      type: string
    - name: date
      label: Tarih
      type: string
    - name: text
      label: Kısa açıklama
      type: text
    - name: detail
      label: Detay
      type: rich-text
      options:
        format: markdown
    - name: cover
      label: Kapak görseli
      type: image
      options:
        media: images
    - name: capacity
      label: Kontenjan
      type: number
    - name: registration_open
      label: Kayıt açık
      type: boolean
    - name: certificate_enabled
      label: Sertifika var
      type: boolean
    - name: status
      label: Durum
      type: string
    - name: url
      label: Sayfa yolu
      type: string
- name: announcements
  label: Duyurular
  type: file
  path: content/announcements.json
  format: json
  operations:
    delete: false
    rename: false
  fields:
